# HTTPS 代理(.env 里 HTTPS=true 时启动)。80 只做跳转,443 用你的证书转发给 Open WebUI。
# 证书文件固定为  certs/fullchain.pem(服务器证书 + 中间证书链)和  certs/privkey.pem(私钥),见 README。

# WebSocket 升级:有 Upgrade 头就升级,否则保持普通连接
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    server_name _;

    # 供容器健康检查使用
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # 要启用 HSTS 就取消注释。一旦启用,浏览器会在期限内只走 HTTPS,证书出问题时用户无法点"继续访问"。
    # add_header Strict-Transport-Security "max-age=31536000" always;

    server_tokens off;
    client_max_body_size 100m;    # Open WebUI 上传文件;默认 1m 会拒绝大部分文件

    # 用 Docker 内置 DNS + 变量解析上游:openwebui 容器重建换了 IP 后,不用重启本代理
    resolver 127.0.0.11 valid=10s;

    location / {
        set $upstream http://openwebui:8080;
        proxy_pass $upstream;

        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 流式输出不能被缓冲;Codex 一次回复可能要几分钟
        proxy_buffering    off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
