# HTTPS 访问:nginx 代理监听 80(跳转)和 443(用你买的证书)。
# 与 compose.yaml 叠加使用:./ops.sh 在 .env 里 HTTPS=true 时自动叠加。此时 Open WebUI 不再单独占宿主机端口。
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  proxy:
    image: nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236   # nginx 1.28
    restart: unless-stopped
    depends_on:
      openwebui:
        condition: service_healthy
    ports:
      - "${PUBLIC_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${PUBLIC_BIND:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - "${CERT_DIR:-./certs}:/etc/nginx/certs:ro"   # 里面放 fullchain.pem 和 privkey.pem
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/nginx-health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 256m
    pids_limit: 100
    security_opt: ["no-new-privileges:true"]
    logging: *logging
